{% extends 'layout.html' %}
{% block title %} | Register {% endblock %}
{% block content %}
<h2>Register</h2>
<div class="">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already have an account?<a href="{% url 'login' %}">LOGIN</a></p>
</div>
{% endblock %}
