{% extends 'layout.html' %}
{% block title %} | Login {% endblock %}
{% block content %}
<h2>Login</h2>
<div class="">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account?<a href="{% url 'register' %}">REGISTER</a></p>
</div>
{% endblock %}
